name: Contracts

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0

      - name: Verify reference wallet
        run: python3 scripts/v1/verify-jetton-wallet.py

      - name: Build
        run: acton build

      - name: Formatter
        run: acton fmt --check

      - name: Linter
        run: acton check --output-format github

      - name: Prepare DeDust libraries
        run: python3 scripts/shared/run-market-simulation.py v2 --prepare-only

      - name: Test
        run: acton test

      - name: Reproducible market and creator claims
        run: acton run market-quick

      - name: V2 presets and migration
        run: acton run v2-simulation

      - name: Market simulation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-simulation
          path: build/market-simulation/
          if-no-files-found: ignore
          retention-days: 14
