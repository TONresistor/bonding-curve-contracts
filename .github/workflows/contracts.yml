name: Contracts

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
      - dev
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676 # v1.0.0

      - name: Build V2
        run: acton build BondingCurveMasterV2

      - name: Formatter
        run: acton fmt --check contracts/v2 scripts/v2 tests/v2 wrappers/*V2.gen.tolk

      - name: Linter
        run: |
          for source in contracts/v2/*.tolk; do
            acton check "$source" --output-format github
          done

      - name: Prepare DeDust libraries
        run: python3 scripts/shared/run-market-simulation.py v2 --prepare-only

      - name: Test V2
        run: acton test tests/v2

      - name: V2 presets and migration
        run: acton run v2-simulation -- --offline

      - name: Market simulation artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: market-simulation
          path: build/market-simulation/
          if-no-files-found: ignore
          retention-days: 14

  sdk:
    name: SDK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: sdk/package-lock.json
      - name: Setup Acton
        uses: ton-blockchain/setup-acton@2d38fd579e1bf8753a3e0cff9ad695612b98a676
      - name: Install SDK dependencies
        run: npm ci --prefix sdk
      - name: Check generated wrappers
        run: npm run check:wrappers --prefix sdk
      - name: SDK formatting
        run: npm run format:check --prefix sdk
      - name: Prepare SDK DeDust libraries
        run: python3 scripts/shared/run-market-simulation.py v2 --prepare-only
      - name: Test SDK
        run: npm test --prefix sdk
      - name: Check package
        working-directory: sdk
        run: npm pack --dry-run
